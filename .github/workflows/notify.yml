name: Scheduled notifications

# Vercel's free plan only runs crons once a day, so this pings the app every 15
# minutes; the endpoint itself decides who is due a reminder (and sends it once).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      # Skipped (not failed) until both repository secrets have been added
      - name: Trigger due notifications
        if: ${{ env.NOTIFY_SECRET != '' && env.APP_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            "$APP_URL/api/cron/notify"
