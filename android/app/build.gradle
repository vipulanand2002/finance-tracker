plugins {
    id 'com.android.application'
}

// CI supplies a fixed signing key, so every build is signed the same way and installs
// over the previous one. Without it (local builds) the default debug key is used.
def ciKeystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.vipul.financetracker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vipul.financetracker'
        minSdk 24
        targetSdk 34
        // CI bumps versionCode from the run number so each build installs over the last
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    if (ciKeystore) {
        signingConfigs {
            ci {
                storeFile file(ciKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'financetracker'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (ciKeystore) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
